services:
  postgres:
    image: postgres:17-alpine
    container_name: saki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saki
      POSTGRES_PASSWORD: saki_dev_password
      POSTGRES_DB: saki_db
    ports:
      - "5432:5432"
    volumes:
      - saki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saki -d saki_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  saki_pgdata:
